<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gourmet Dine - Digital Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-light: #fff7ed;
      --dark: #0f172a;
      --slate: #64748b;
      --card-bg: #ffffff;
      --bg: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: #1e293b; padding-bottom: 110px; }

    /* Sticky Glass Header */
    .header {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      padding: 12px 18px;
    }
    .header-content {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title { font-size: 19px; font-weight: 800; color: var(--dark); letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
    .brand-title span { color: var(--primary); }
    .badge-live { font-size: 10px; background: #ecfdf5; color: #10b981; font-weight: 700; padding: 2px 8px; border-radius: 20px; border: 1px solid #a7f3d0; }
    
    .btn-kitchen {
      background: var(--dark);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      transition: 0.2s;
    }
    .btn-kitchen:active { transform: scale(0.95); }

    .main-wrap { max-width: 480px; margin: 0 auto; padding: 14px 16px; }

    /* Table Selector Bar */
    .table-bar {
      background: #ffffff;
      border: 1px solid #f1f5f9;
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px -3px rgba(0,0,0,0.03);
      margin-bottom: 12px;
    }
    .table-info { display: flex; align-items: center; gap: 10px; }
    .table-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .table-label { font-size: 11px; font-weight: 600; color: var(--slate); }
    .table-select {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-weight: 700;
      color: var(--dark);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }

    /* Search Box */
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }
    .search-box i { position: absolute; left: 14px; top: 13px; color: #94a3b8; font-size: 14px; }
    .search-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 10px 14px 10px 38px;
      border-radius: 14px;
      font-size: 13px;
      outline: none;
      transition: 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12); }

    /* Category Pill Carousel */
    .cat-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
      margin-bottom: 14px;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      white-space: nowrap;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: var(--slate);
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }

    /* Premium Food Card */
    .food-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 4px 14px -3px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s;
      position: relative;
    }
    .food-card:hover { transform: translateY(-2px); }
    .food-img-wrap {
      width: 88px;
      height: 88px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #f1f5f9;
    }
    .food-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .food-details { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
    .food-tag { font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
    .food-name { font-size: 15px; font-weight: 700; color: var(--dark); margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .food-price { font-size: 16px; font-weight: 800; color: var(--dark); }
    
    /* Stepper Buttons (- 1 +) */
    .add-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #fed7aa;
      padding: 7px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      align-self: flex-end;
      transition: 0.15s;
    }
    .add-btn:active { transform: scale(0.92); background: var(--primary); color: #fff; }
    
    .stepper {
      display: flex;
      align-items: center;
      background: var(--primary-light);
      border: 1px solid #fed7aa;
      border-radius: 10px;
      padding: 2px;
      align-self: flex-end;
    }
    .stepper button {
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stepper span { font-size: 13px; font-weight: 800; padding: 0 6px; color: var(--dark); }

    /* Floating Capsule Cart */
    .cart-capsule {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      max-width: 448px;
      margin: 0 auto;
      background: #0f172a;
      color: white;
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 16px 36px -6px rgba(15, 23, 42, 0.4);
      z-index: 50;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .cart-summary { display: flex; align-items: center; gap: 12px; }
    .cart-badge { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: white; }
    .cart-label { font-size: 11px; color: #94a3b8; font-weight: 500; }
    .cart-total-price { font-size: 17px; font-weight: 800; color: #ffffff; }

    .btn-view-order {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35);
    }

    /* Bottom Sheet Cart Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 28px 28px 0 0;
      padding: 22px 20px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      animation: sheetUp 0.25s ease-out;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 14px; }
    .sheet-title { font-size: 18px; font-weight: 800; color: var(--dark); }
    .sheet-close { width: 30px; height: 30px; border-radius: 50%; background: #f1f5f9; border: none; font-size: 13px; color: var(--slate); cursor: pointer; }
    .order-items-scroll { flex: 1; overflow-y: auto; margin-bottom: 14px; }
    .cart-line-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f8fafc; font-size: 14px; }
    .cart-line-name { font-weight: 700; color: var(--dark); }
    .cart-line-price { font-weight: 800; color: var(--primary); }

    .btn-confirm-order {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
    }

    /* Luxury Dark Kitchen View */
    #kitchenView { display: none; background: #0b0f19; min-height: 100vh; padding: 20px 16px; color: white; position: fixed; inset: 0; z-index: 200; overflow-y: auto; }
    .k-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 20px; }
    .k-title { font-size: 18px; font-weight: 900; color: #f97316; letter-spacing: -0.5px; }
    .k-btn-sound { background: #ea580c; color: white; border: none; padding: 7px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer; }
    .k-btn-back { background: #1e293b; color: white; border: none; padding: 7px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    
    .k-card {
      background: #141b2d;
      border-radius: 18px;
      padding: 16px;
      border: 1px solid #232f48;
      margin-bottom: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .k-card-top { display: flex; justify-content: space-between; align-items: center; }
    .k-table { font-size: 18px; font-weight: 900; color: #ffffff; }
    .k-total { font-size: 16px; font-weight: 900; color: var(--primary); }
    .k-time { font-size: 11px; color: #64748b; margin: 4px 0 12px; }
    .k-items { background: #0b0f19; padding: 12px; border-radius: 12px; border: 1px dashed #334155; font-size: 14px; font-weight: 600; color: #f1f5f9; line-height: 1.5; margin-bottom: 14px; }
    .k-btn-serve { width: 100%; background: #10b981; color: #022c22; font-weight: 800; padding: 12px; border-radius: 12px; border: none; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- ================= CUSTOMER VIEW ================= -->
  <div id="customerView">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div>
          <div class="brand-title">ROYAL DINE <span>.</span></div>
          <div class="badge-live">● Live Dine-in Ordering</div>
        </div>
        <button class="btn-kitchen" onclick="openKitchenMode()">
          <i class="fa-solid fa-bell"></i> কিচেন মোড
        </button>
      </div>
    </header>

    <div class="main-wrap">
      <!-- Table Selector -->
      <div class="table-bar">
        <div class="table-info">
          <div class="table-icon"><i class="fa-solid fa-utensils"></i></div>
          <div>
            <div class="table-label">বর্তমান টেবিল</div>
            <div style="font-size: 13px; font-weight: 800;">আপনার আসন নির্বাচন করুন</div>
          </div>
        </div>
        <select id="selectedTable" class="table-select">
          <option value="Table 01">Table 01</option>
          <option value="Table 02">Table 02</option>
          <option value="Table 03">Table 03</option>
          <option value="Table 04">Table 04</option>
          <option value="Table 05">Table 05</option>
          <option value="Table 06">Table 06</option>
        </select>
      </div>

      <!-- Live Search Box -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="খাবারের নাম দিয়ে খুঁজুন..." class="search-input" oninput="renderMenu()">
      </div>

      <!-- Categories Scroll -->
      <div class="cat-scroll" id="catScroll">
        <button class="cat-btn active" onclick="setCategory('All', this)">All Items</button>
      </div>

      <!-- Food List -->
      <div id="menuContainer">
        <div style="text-align:center; padding: 40px 0; color: #94a3b8; font-weight: 600;">
          <i class="fa-solid fa-spinner fa-spin" style="font-size:24px; color:var(--primary); margin-bottom:8px; display:block;"></i>
          মেনু লোড হচ্ছে...
        </div>
      </div>
    </div>

    <!-- Floating Capsule Cart -->
    <div class="cart-capsule" id="cartCapsule" style="display: none;">
      <div class="cart-summary">
        <div class="cart-badge" id="cartItemCount">0</div>
        <div>
          <div class="cart-label">Total Amount</div>
          <div class="cart-total-price">৳<span id="cartTotalPrice">0</span></div>
        </div>
      </div>
      <button class="btn-view-order" onclick="openCartModal()">
        <span>অর্ডার দেখুন</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- ================= CART MODAL (BOTTOM SHEET) ================= -->
  <div class="modal-overlay" id="cartModal" onclick="closeCartModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="sheet-header">
        <div>
          <div class="sheet-title">আপনার অর্ডার তালিকা</div>
          <div style="font-size:11px; color:#64748b;" id="modalTableText">Table 01</div>
        </div>
        <button class="sheet-close" onclick="closeCartModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="order-items-scroll" id="modalItemsList"></div>

      <div style="border-top: 1px solid #f1f5f9; padding-top: 12px; margin-bottom: 14px;">
        <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:800;">
          <span>মোট প্রদেয় বিল:</span>
          <span style="color:var(--primary);">৳<span id="modalFinalTotal">0</span></span>
        </div>
      </div>

      <button class="btn-confirm-order" id="btnSubmitOrder" onclick="submitFinalOrder()">
        <span>অর্ডার প্লেস করুন</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <!-- ================= KITCHEN DISPLAY VIEW ================= -->
  <div id="kitchenView">
    <div class="k-header">
      <div>
        <div class="k-title">👨‍🍳 KITCHEN ORDER DISPLAY</div>
        <div style="font-size: 11px; color: #64748b; margin-top:2px;">অটোমেটিক রিয়েল-টাইম সাউন্ড বেল অন আছে</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="k-btn-sound" onclick="playBeep()"><i class="fa-solid fa-bell"></i> সাউন্ড টেস্ট</button>
        <button class="k-btn-back" onclick="closeKitchenMode()">← মেনু পেজ</button>
      </div>
    </div>
    <div id="kOrdersContainer">
      <div style="text-align:center; padding:60px 0; color:#64748b;">অর্ডার লোড হচ্ছে...</div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwa4Ntvki5EuTIHKXP-6Q3M_e2C0ENa_OIo38EgwI93jnuuBSWxuedJ9JJ9qVbniIH1aQ/exec";

    let menu = [];
    let cart = {};
    let activeCategory = "All";
    let isFirstLoad = true;
    let lastOrderCount = 0;
    let kitchenInterval = null;
    let audioCtx = null;

    // 🔊 Audio Bell Engine
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep() {
      try {
        initAudio();
        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.frequency.setValueAtTime(880, now);
        gain1.gain.setValueAtTime(0.8, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.6);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.frequency.setValueAtTime(587.33, now + 0.2);
        gain2.gain.setValueAtTime(0.8, now + 0.2);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.2);
        osc2.stop(now + 1.2);
      } catch (e) {}
    }

    // 📥 Fetch Menu Data
    async function fetchMenuData() {
      try {
        const res = await fetch(SCRIPT_URL, { redirect: "follow" });
        const json = await res.json();
        menu = json.data;
        renderCategories();
        renderMenu();
      } catch (e) {
        document.getElementById('menuContainer').innerHTML = '<div style="text-align:center; color:red; padding:40px 0;">মেনু লোড করা সম্ভব হয়নি!</div>';
      }
    }

    // 🏷️ Category Pills
    function renderCategories() {
      const cats = ["All", ...new Set(menu.map(i => i.category))];
      const scroll = document.getElementById('catScroll');
      scroll.innerHTML = cats.map(c => `
        <button class="cat-btn ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c}', this)">
          ${c === 'All' ? 'All Items' : c}
        </button>
      `).join('');
    }

    function setCategory(cat, el) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderMenu();
    }

    // 🍔 Render Menu Items
    function renderMenu() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = menu.filter(item => {
        const matchCat = activeCategory === "All" || item.category === activeCategory;
        const matchSearch = item.name.toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      const container = document.getElementById('menuContainer');
      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:40px 0; color:#94a3b8; font-weight:600;">কোনো খাবার খুঁজে পাওয়া যায়নি</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const qty = cart[item.id] ? cart[item.id].qty : 0;
        return `
          <div class="food-card">
            <div class="food-img-wrap">
              <img src="${item.image}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'">
            </div>
            <div class="food-details">
              <div>
                <div class="food-tag">${item.category}</div>
                <div class="food-name">${item.name}</div>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <div class="food-price">৳${item.price}</div>
                ${qty === 0 ? `
                  <button class="add-btn" onclick="modifyCart('${item.id}', 1)">+ Add</button>
                ` : `
                  <div class="stepper">
                    <button onclick="modifyCart('${item.id}', -1)">-</button>
                    <span>${qty}</span>
                    <button onclick="modifyCart('${item.id}', 1)">+</button>
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 🛒 Cart Logic
    function modifyCart(id, change) {
      const item = menu.find(i => i.id == id);
      if (!cart[id]) cart[id] = { ...item, qty: 0 };
      cart[id].qty += change;
      if (cart[id].qty <= 0) delete cart[id];

      updateCapsule();
      renderMenu();
    }

    function updateCapsule() {
      const items = Object.values(cart);
      const totalCount = items.reduce((s, i) => s + i.qty, 0);
      const totalPrice = items.reduce((s, i) => s + (i.price * i.qty), 0);

      const capsule = document.getElementById('cartCapsule');
      if (totalCount > 0) {
        capsule.style.display = 'flex';
        document.getElementById('cartItemCount').innerText = totalCount;
        document.getElementById('cartTotalPrice').innerText = totalPrice;
      } else {
        capsule.style.display = 'none';
      }
    }

    // 📋 Cart Modal (Bottom Sheet)
    function openCartModal() {
      const table = document.getElementById('selectedTable').value;
      document.getElementById('modalTableText').innerText = "অর্ডার করার টেবিল: " + table;

      const list = document.getElementById('modalItemsList');
      const items = Object.values(cart);
      let total = 0;

      list.innerHTML = items.map(i => {
        total += i.price * i.qty;
        return `
          <div class="cart-line-item">
            <div>
              <div class="cart-line-name">${i.name}</div>
              <div style="font-size:11px; color:#64748b;">৳${i.price} × ${i.qty}</div>
            </div>
            <div class="cart-line-price">৳${i.price * i.qty}</div>
          </div>
        `;
      }).join('');

      document.getElementById('modalFinalTotal').innerText = total;
      document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCartModal() {
      document.getElementById('cartModal').style.display = 'none';
    }

    // 🚀 Order Submit
    async function submitFinalOrder() {
      const table = document.getElementById('selectedTable').value;
      const btn = document.getElementById('btnSubmitOrder');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> কিচেনে পাঠানো হচ্ছে...';
      btn.disabled = true;

      const itemsText = Object.values(cart).map(i => `${i.name} (x${i.qty})`).join(', ');
      let total = 0;
      Object.values(cart).forEach(i => total += (i.price * i.qty));

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ table: table, items: itemsText, total: total })
        });

        alert("🎉 চমৎকার! আপনার অর্ডারটি সরাসরি কিচেনে পাঠানো হয়েছে।");
        cart = {};
        updateCapsule();
        renderMenu();
        closeCartModal();
      } catch (e) {
        alert("অর্ডার পাঠাতে সমস্যা হয়েছে!");
      } finally {
        btn.innerHTML = '<span>অর্ডার প্লেস করুন</span> <i class="fa-solid fa-paper-plane"></i>';
        btn.disabled = false;
      }
    }

    // 🔒 Kitchen Mode
    function openKitchenMode() {
      const pin = prompt("কিচেন পিন কোড দিন:");
      if (pin === "1234") {
        initAudio();
        document.getElementById('kitchenView').style.display = 'block';
        isFirstLoad = true;
        fetchKitchenOrders();
        kitchenInterval = setInterval(fetchKitchenOrders, 4000);
      } else if (pin !== null) {
        alert("❌ ভুল পিন কোড!");
      }
    }

    function closeKitchenMode() {
      document.getElementById('kitchenView').style.display = 'none';
      if (kitchenInterval) clearInterval(kitchenInterval);
    }

    async function fetchKitchenOrders() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getOrders`, { redirect: "follow" });
        const json = await res.json();
        const orders = json.orders || [];

        if (!isFirstLoad && orders.length > lastOrderCount) {
          playBeep();
        }
        lastOrderCount = orders.length;
        isFirstLoad = false;

        const container = document.getElementById('kOrdersContainer');
        if (orders.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:60px 0; color:#64748b; font-weight:700;">সব রান্না শেষ! পেন্ডিং কোনো অর্ডার নেই 🎉</div>';
          return;
        }

        container.innerHTML = orders.map(o => `
          <div class="k-card">
            <div class="k-card-top">
              <span class="k-table">${o.table}</span>
              <span class="k-total">৳${o.total}</span>
            </div>
            <div class="k-time">সময়: ${o.date}</div>
            <div class="k-items">${o.items}</div>
            <button class="k-btn-serve" onclick="completeKitchenOrder(${o.rowIndex})">✓ রান্না শেষ (Mark as Served)</button>
          </div>
        `).join('');
      } catch (e) {}
    }

    async function completeKitchenOrder(row) {
      await fetch(`${SCRIPT_URL}?action=completeOrder&row=${row}`, { redirect: "follow" });
      fetchKitchenOrders();
    }

    fetchMenuData();
  </script>
</body>
</html>
